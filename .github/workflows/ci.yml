name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Validate detection rules
        run: python -m detection_engine rules
      - name: Run tests
        run: pytest -v
      - name: Run detections on the sample attack
        run: python -m detection_engine scan samples/auth.log samples/cloudtrail.jsonl --out reports
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: detection-report
          path: reports/
